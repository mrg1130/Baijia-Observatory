name: macOS release packages
on:
  push:
    branches: ['release/macos-1.3.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and verify macOS installer
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          bash packaging/build_macos.sh
          app="/Applications/百家观测.app"
          lipo -verify_arch "$EXPECTED_ARCH" "$app/Contents/MacOS/BaijiaObservatory"
          cmp "studio/manual.pdf" "$app/Contents/Resources/studio/manual.pdf"
          test -f "release/BaijiaObservatory-1.3.1-macOS-$EXPECTED_ARCH.pkg"
          shasum -a 256 release/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release/*.pkg
          if-no-files-found: error
