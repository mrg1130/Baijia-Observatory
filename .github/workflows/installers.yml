name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: ['release/baijia-1.4.0']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and verify macOS installer
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          expected=arm64
          if [[ "$RUNNER_LABEL" == *-intel ]]; then expected=x86_64; fi
          test "$(uname -m)" = "$expected"
          bash packaging/build_macos.sh
          app="/Applications/百家观测.app"
          test "$(lipo -archs "$app/Contents/MacOS/BaijiaObservatory")" = "$expected"
          cmp studio/manual.pdf "$app/Contents/Resources/studio/manual.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.runner }}
          path: release/*.pkg
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python packaging/build_windows.py
      - name: Verify packaged Windows app
        shell: pwsh
        run: |
          $env:BAIJIA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'baijia-smoke'
          $app = Join-Path $PWD 'dist/BaijiaObservatory/BaijiaObservatory.exe'
          Start-Process -FilePath $app -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait
          Start-Process -FilePath $app -ArgumentList '--ui-smoke-test' -WindowStyle Hidden -Wait
          python -c "import json,os; from pathlib import Path; p=Path(os.environ['BAIJIA_DATA_DIR']); assert json.loads((p/'smoke-test.json').read_text(encoding='utf-8'))['status']=='ok'; r=json.loads((p/'ui-smoke-test.json').read_text(encoding='utf-8')); assert r['status']=='ok',r"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: release/*Setup.exe
  release:
    if: github.event_name == 'push'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare installation notes
        id: version
        run: |
          VERSION="$(python -c 'import runpy; print(runpy.run_path("studio/version.py")["APP_VERSION"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp studio/manual.pdf release/Manual.pdf
          (cd release && sha256sum *.pkg *.exe Manual.pdf > SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          百家观测 $VERSION

          - 自定义统计器可按标题搜索，并组合作者、发布时间、作品类型和手选范围。
          - 支持跨页勾选，统计结果和 CSV 使用同一批作品。

          Windows：运行 Windows-x64-Setup.exe，完成后打开桌面快捷方式。
          Apple Silicon Mac：运行 macOS-arm64.pkg。
          Intel Mac：运行 macOS-x86_64.pkg。
          Mac 安装后从「应用程序」打开「百家观测」。首次安装如需确认开发者，在「系统设置 → 隐私与安全性」中选择「仍要打开」。

          打开软件直接进入工作台。图文教程见 Manual.pdf，软件内也可直接打开。
          EOF
      - name: Publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$APP_VERSION" --target "$GITHUB_SHA" --title "百家观测 $APP_VERSION" --latest --notes-file release-notes.md release/*
